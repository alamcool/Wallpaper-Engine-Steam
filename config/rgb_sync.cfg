# Wallpaper Engine - RGB Lighting Sync Configuration
# Sync wallpaper colors to your RGB peripherals

[razer_chroma]
enabled = false
sdk_version = 4.0
sync_keyboards = true
sync_mice = true
sync_headsets = true
sync_mousepads = true
sync_chairs = true
brightness = 80
effect = reactive
color_extraction_mode = dominant

[corsair_icue]
enabled = false
sdk_version = 5.0
sync_keyboards = true
sync_mice = true
sync_headsets = true
sync_fans = true
sync_strips = true
brightness = 75
effect = gradient
color_extraction_mode = average

[philips_hue]
enabled = false
bridge_ip = 192.168.1.100
bridge_username = 
api_key = 
entertainment_mode = true
lights = living_room_1,living_room_2,bedroom_1
brightness = 60
transition_time_ms = 200
color_extraction_mode = dominant

[signal_rgb]
enabled = false
port = 12345

[open_rgb]
enabled = false
port = 6742

[general]
sync_interval_ms = 50
max_color_change_per_step = 0.15
smooth_factor = 0.7
black_threshold = 0.05
white_threshold = 0.95
