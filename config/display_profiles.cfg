# Wallpaper Engine - Multi-Monitor Display Profiles
# Assign wallpapers to individual monitors or use panoramic span mode

[profile:default]
mode = independent
monitor_0 = auto
monitor_1 = auto
monitor_2 = auto
transition = crossfade

[profile:gaming]
mode = span
span_wallpaper = 
pause_secondary = true
primary_monitor = 0

[profile:work]
mode = independent
monitor_0 = nature_forest_rain.mp4
monitor_1 = minimalist_geometric.pkg
pause_on_fullscreen = true

[profile:anime]
mode = independent
monitor_0 = genshin_furina_live.mp4
monitor_1 = demon_slayer_water.pkg
transition = slide

[profile:minimal]
mode = independent
monitor_0 = gradient_flow.pkg
monitor_1 = monochrome_particles.pkg
transition = fade

[monitor_info]
# Detected on startup:
# Monitor 0: primary, 3840x2160, scale=1.0
# Monitor 1: secondary, 1920x1080, scale=1.0
# Monitor 2: optional, 2560x1440, scale=1.25
