# Wallpaper Engine - Performance Configuration
# Tune resource usage to minimize impact on gaming

[rendering]
quality_level = 2
# 0 = Low (720p, bilinear), 1 = Medium (1080p, bicubic), 
# 2 = High (1440p, lanczos), 3 = Very High (4K, lanczos), 4 = Ultra (native, SSAA)
max_fps = 60
vsync_enabled = true
hardware_acceleration = true
dxva2_decoding = true
av1_support = true
hdr10_plus = false

[gpu]
usage_limit_percent = 30
# Wallpaper Engine will try to stay under this GPU usage
reduce_quality_when_gaming = true
target_gpu_usage_when_gaming = 5
power_saving_mode = false

[cpu]
usage_limit_percent = 10
thread_priority = below_normal
process_priority = below_normal

[memory]
ram_limit_mb = 512
cache_size_mb = 2048
cache_location = %TEMP%/WallpaperEngine/cache
purge_cache_after_hours = 24
preload_next_wallpaper = true

[pause_behavior]
pause_on_fullscreen = true
pause_on_battery = false
pause_on_cpu_high = false
pause_cpu_threshold = 80
pause_on_gpu_high = true
pause_gpu_threshold = 85
resume_delay_ms = 2000
auto_resume = true

[frame_management]
frame_skip = true
adaptive_fps = true
min_fps = 15
max_fps_idle = 30
max_fps_active = 60

[debug]
enable_logging = false
log_level = info
log_file = %TEMP%/WallpaperEngine/log.txt
performance_overlay = false
